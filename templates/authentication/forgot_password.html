{% extends 'base/base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-100 py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 p-3 rounded-circle d-inline-block mb-3">
                        <i class="bi bi-key text-primary fs-1"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Forgot Password</h3>
                    <p class="text-muted small">Enter your email to reset your password</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label small fw-bold">Email Address</label>
                        {{ form.email }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Send Reset Link</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'login' %}" class="small text-decoration-none">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
