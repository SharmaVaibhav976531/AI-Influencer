{% extends 'base/base.html' %}
{% block title %}Reset Email Sent{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-100 py-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5 text-center">
                <div class="bg-success bg-opacity-10 p-3 rounded-circle d-inline-block mb-3">
                    <i class="bi bi-envelope-check text-success fs-1"></i>
                </div>
                <h3 class="fw-bold mb-2">Check Your Email</h3>
                <p class="text-muted">If an account exists with the email you entered, we have sent password reset instructions.</p>
                <a href="{% url 'login' %}" class="btn btn-primary mt-3">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
