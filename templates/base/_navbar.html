<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm fixed-top px-3">
    <div class="container-fluid">
        <!-- Sidebar Toggle: Only show if authenticated -->
        {% if request.user.is_authenticated %}
            <button class="btn btn-link text-dark p-0 me-3" id="sidebarToggle" aria-label="Toggle Sidebar">
                <i class="bi bi-list fs-4"></i>
            </button>
        {% endif %}
        
        <a class="navbar-brand fw-bold text-primary d-flex align-items-center" href="{% url 'dashboard:home' %}">
            <i class="bi bi-stars me-2"></i> Influencer AI
        </a>

        <div class="ms-auto d-flex align-items-center gap-3">
            {% if request.user.is_authenticated %}
                <!-- Notifications Placeholder -->
                <button class="btn btn-light position-relative" aria-label="Notifications" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Notifications">
                    <i class="bi bi-bell"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">3</span>
                </button>

                <!-- User Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-light dropdown-toggle d-flex align-items-center" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-2 fs-5"></i>
                        <span class="d-none d-md-inline">{{ request.user.username|title }}</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li>
                            <a class="dropdown-item text-muted disabled d-flex align-items-center justify-content-between" href="javascript:void(0);" data-bs-toggle="tooltip" data-bs-placement="left" title="Coming Soon">
                                <span><i class="bi bi-gear me-2"></i>Settings</span>
                                <span class="badge bg-secondary ms-2 small opacity-75">Soon</span>
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>
            {% else %}
                <a href="{% url 'signup' %}" class="btn btn-outline-primary">
                    <i class="bi bi-person-plus me-2"></i> Sign Up
                </a>
                <a href="{% url 'login' %}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Login
                </a>
            {% endif %}
        </div>
    </div>
</nav>
